<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P8B665RWVK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P8B665RWVK');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Contact - NovaNext</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
  .form-wrap { width: min(560px, 92%); margin: 0 auto 84px; }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 44px; box-shadow: var(--shadow-md); }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .field input, .field textarea { width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 15px; color: var(--text); background: var(--bg); transition: border-color .15s ease, box-shadow .15s ease; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .14); }
  .field textarea { resize: vertical; min-height: 140px; }
  .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: #fff; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; background: var(--gradient); transition: .2s; }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(37, 99, 235, .28); }
  .submit-btn:disabled { opacity: .65; cursor: default; transform: none; box-shadow: none; }
  .status { margin-top: 16px; font-size: 14px; text-align: center; display: none; font-weight: 600; }
  .status.success { color: var(--green); display: block; }
  .status.error { color: #ef4444; display: block; }
  .hp { position: absolute; left: -9999px; }
  @media (max-width: 600px) { .form-card { padding: 28px 22px; } }
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page-hero">
    <div class="container">
      <div class="eyebrow"><span class="dot"></span>Get in touch</div>
      <h1>Let's <span class="accent">talk</span>.</h1>
      <p>Questions, feedback, or a bug to report — send a message and we'll get back to you.</p>
    </div>
  </header>

  <div class="form-wrap">
    <div class="form-card">
      <form id="contact-form" data-endpoint="https://formspree.io/f/xpqqpgnl">
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">
        <input type="hidden" name="_subject" id="subject-field" value="New message from NovaNext contact form">

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">Send message</button>
        <p class="status" id="status"></p>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="apps.js"></script>
<script>
  renderChrome('contact');

  const form = document.getElementById('contact-form');
  const status = document.getElementById('status');
  const btn = document.getElementById('submit-btn');
  const message = document.getElementById('message');
  const subjectField = document.getElementById('subject-field');

  const appParam = new URLSearchParams(window.location.search).get('app');
  if (appParam) {
    subjectField.value = `Support request: ${appParam}`;
    message.value = `Regarding: ${appParam}\n\n`;
    message.focus();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.className = 'status';
    status.textContent = '';

    const formData = new FormData(form);
    const endpoint = form.dataset.endpoint;

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: formData
      });

      if (response.ok) {
        status.textContent = "Message sent — we'll get back to you soon.";
        status.className = 'status success';
        form.reset();
      } else {
        const result = await response.json().catch(() => null);
        status.textContent = (result && result.errors && result.errors[0]?.message)
          ? result.errors[0].message
          : 'Something went wrong. Please try again.';
        status.className = 'status error';
      }
    } catch (err) {
      status.textContent = 'Network error. Please try again.';
      status.className = 'status error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send message';
    }
  });
</script>
</body>
</html>
