    <meta charset="UTF-8">

    <title>Products - NovaNext</title>

    <style>
        :root {
            --bg: #fafaf8;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --blue: #2563eb;
            --purple: #7c3aed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 1px 0 var(--border), 0 4px 16px rgba(17,24,39,.04);
        }
        .nav-inner {
            width: min(1120px, 92%);
            margin: auto;
            height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }
        .logo img {
            height: 34px;
            width: auto;
            display: block;
        }
        .logo span {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a { text-decoration: none; color: var(--muted); font-weight: 500; }
        .nav-links a:hover { color: var(--text); }
        .nav-links a.active { color: var(--text); }
        .nav-cta {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white !important;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: .2s;
        }
        .nav-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37,99,235,.25);
        }

        /* PAGE */
        .container {
            width: min(1120px, 92%);
            margin: auto;
            padding: 80px 0;
        }
        .header {
            text-align: center;
            margin-bottom: 72px;
        }
        .header h1 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 14px;
        }
        .header p {
            color: var(--muted);
            font-size: 18px;
            line-height: 1.7;
        }

        /* PRODUCTS */
        .product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background: white;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px;
            margin-bottom: 24px;
            transition: .2s;
        }
        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,.07);
        }
        .product:nth-child(even) .product-image { order: 2; }
        .product:nth-child(even) .product-content { order: 1; }

        .product-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product-icon {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 34px;
            box-shadow: 0 18px 40px rgba(0,0,0,.12);
            transition: transform .3s;
        }
        .product:hover .product-icon { transform: scale(1.04); }

        .product-category {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--blue);
            background: rgba(37,99,235,.08);
            border-radius: 20px;
            padding: 5px 12px;
            margin-bottom: 12px;
        }
        .product-content h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 10px;
        }
        .product-description {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 18px;
        }
        .product-features {
            list-style: none;
            margin-bottom: 26px;
        }
        .product-features li {
            color: var(--muted);
            font-size: 14px;
            padding: 6px 0 6px 24px;
            position: relative;
            line-height: 1.5;
        }
        .product-features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--blue);
            font-weight: 700;
        }
        .download-button {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: .2s;
            box-shadow: none;
        }
        .download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37,99,235,.25) !important;
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border);
            background: white;
        }
        .footer-inner {
            width: min(1120px, 92%);
            margin: auto;
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { text-decoration: none; color: var(--muted); }
        .footer-links a:hover { color: var(--text); }
        .copyright { color: var(--muted); font-size: 14px; }

        /* MOBILE */
        @media(max-width: 768px) {
            .product {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 32px;
            }
            .product:nth-child(even) .product-image { order: 1; }
            .product:nth-child(even) .product-content { order: 2; }
            .footer-inner {
                flex-direction: column;
                height: auto;
                padding: 24px 0;
                gap: 14px;
            }
        }
    
/* ---------------- BMC BUTTON ---------------- */

.bmc-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#FFDD00;
    color:#000000 !important;
    padding:10px 20px;
    border-radius:12px;
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:.2s;
}

.bmc-link:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(255,221,0,.35);
}

/* ---------------- DEPRECATED PRODUCT ---------------- */

.product.legacy{
    background:#f9fafb;
    border-style:dashed;
}
.product.legacy .product-icon{
    filter:grayscale(1);
    opacity:.6;
    box-shadow:none;
}
.product.legacy .product-category{
    color:var(--muted);
    background:rgba(107,114,128,.12);
}
.product.legacy .download-button{
    background:#e5e7eb;
    color:var(--muted) !important;
}
.product.legacy .download-button:hover{
    transform:none;
    box-shadow:none !important;
}
.legacy-note{
    font-size:14px;
    color:var(--muted);
    background:rgba(107,114,128,.1);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
    line-height:1.5;
}
.legacy-note a{ color:var(--blue); font-weight:600; text-decoration:none; }
.legacy-note a:hover{ text-decoration:underline; }

</style>
