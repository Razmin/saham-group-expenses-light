<html lang="en">
<head>

    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
<style>
:root {
            --bg: #fafaf8;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --blue: #2563eb;
            --purple: #7c3aed;
        }
body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
.container {
            width: min(1120px, 92%);
            margin: auto;
            padding: 80px 0;
        }
.header {
            text-align: center;
            margin-bottom: 72px;
        }
.header h1 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 14px;
        }
.header p {
            color: var(--muted);
            font-size: 18px;
            line-height: 1.7;
        }
.product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background:var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px;
            margin-bottom: 24px;
            transition: .2s;
        }
.product:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,.07);
        }
.product:nth-child(even) .product-image { order: 2; }
.product:nth-child(even) .product-content { order: 1; }
.product-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }
.product-icon {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 34px;
            box-shadow: 0 18px 40px rgba(0,0,0,.12);
            transition: transform .3s;
        }
.product:hover .product-icon { transform: scale(1.04); }
.product-category {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--blue);
            background: rgba(37,99,235,.08);
            border-radius: 20px;
            padding: 5px 12px;
            margin-bottom: 12px;
        }
.product-content h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 10px;
        }
.product-description {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 18px;
        }
.product-features {
            list-style: none;
            margin-bottom: 26px;
        }
.product-features li {
            color: var(--muted);
            font-size: 14px;
            padding: 6px 0 6px 24px;
            position: relative;
            line-height: 1.5;
        }
.product-features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--blue);
            font-weight: 700;
        }
.download-button {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: .2s;
            box-shadow: none;
        }
.download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37,99,235,.25) !important;
        }
@media(max-width: 768px) {
            .product {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 32px;
            }
            .product:nth-child(even) .product-image { order: 1; }
            .product:nth-child(even) .product-content { order: 2; }
            .footer-inner {
                flex-direction: column;
                height: auto;
                padding: 24px 0;
                gap: 14px;
            }
        }
.product.legacy{
    background:var(--bg);
    border-style:dashed;
}
.product.legacy .product-icon{
    filter:grayscale(1);
    opacity:.6;
    box-shadow:none;
}
.product.legacy .product-category{
    color:var(--muted);
    background:rgba(107,114,128,.12);
}
.product.legacy .download-button{
    background:var(--border);
    color:var(--muted) !important;
}
.product.legacy .download-button:hover{
    transform:none;
    box-shadow:none !important;
}
.legacy-note{
    font-size:14px;
    color:var(--muted);
    background:rgba(107,114,128,.1);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
    line-height:1.5;
}
.legacy-note a{ color:var(--blue); font-weight:600; text-decoration:none; }
.legacy-note a:hover{ text-decoration:underline; }
</style>
</head>
<body>

    </div>
</div>

    renderProductList();
</script>

</body>
</html>
