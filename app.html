<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P8B665RWVK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-P8B665RWVK');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NovaNext iOS apps">
    <title>App - NovaNext</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
  .app-container { width: min(1120px, 92%); margin: auto; padding: 44px 0 84px; }
  .back-link { display: inline-block; margin-bottom: 28px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  .back-link:hover { color: var(--text); }
  .app-hero { display: flex; align-items: center; gap: 40px; margin-bottom: 52px; }
  .app-hero-icon { width: 172px; height: 172px; flex: none; object-fit: contain; border-radius: 38px; box-shadow: var(--shadow-lg); }
  .app-hero h1 { font-size: clamp(32px, 5vw, 50px); font-weight: 800; letter-spacing: -0.04em; margin: 10px 0 12px; }
  .app-hero-description { color: var(--muted); font-size: 17.5px; line-height: 1.7; margin-bottom: 22px; max-width: 60ch; }
  .screenshots-section { margin-bottom: 52px; }
  .screenshots-section[hidden] { display: none; }
  .screenshots { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 14px; scroll-snap-type: x proximity; }
  .shot-pair { display: flex; gap: 16px; flex: none; align-items: flex-end; scroll-snap-align: start; }
  .screenshots img { height: auto; max-height: 420px; width: auto; flex: none; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-md); }
  .app-features, .app-about, .app-how { margin-bottom: 44px; }
  .app-features h2, .app-about h2, .app-how h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 14px; }
  .app-about p { color: var(--muted); font-size: 16px; line-height: 1.8; max-width: 70ch; }
  .app-how ol { padding-left: 24px; max-width: 70ch; }
  .app-how li { color: var(--muted); font-size: 16px; line-height: 1.65; padding: 6px 0 6px 6px; }
  .app-offline { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .app-links { display: flex; flex-wrap: wrap; gap: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
  .app-links a { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 14.5px; }
  .app-links a:hover { text-decoration: underline; }
  .app-missing { text-align: center; padding: 80px 0; }
  .app-missing h1 { font-size: 34px; font-weight: 800; margin-bottom: 12px; }
  .app-missing a { color: var(--blue); font-weight: 600; text-decoration: none; }
  @media (max-width: 768px) {
    .app-hero { flex-direction: column; align-items: flex-start; gap: 22px; }
    .app-hero-icon { width: 120px; height: 120px; border-radius: 28px; }
    .screenshots img { max-height: 320px; }
  }
</style>
</head>
<body>
<div id="site-nav"></div>
<main class="app-container" id="app-page"></main>
<div id="site-footer"></div>

<script src="apps.js"></script>
<script>
  renderChrome('products');
  renderAppPage('app-page');
</script>
</body>
</html>
