<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App - NovaNext</title>
    <meta name="description" content="NovaNext iOS apps">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafaf8;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --blue: #2563eb;
            --purple: #7c3aed;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 1px 0 var(--border), 0 4px 16px rgba(17,24,39,.04);
        }
        .nav-inner {
            width: min(1120px, 92%); margin: auto; height: 72px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .logo img { height: 34px; width: auto; display: block; }
        .logo span {
            font-size: 22px; font-weight: 800; letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .nav-links { display: flex; align-items: center; gap: 28px; }
        .nav-links a { text-decoration: none; color: var(--muted); font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }
        .nav-cta {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white !important; padding: 10px 20px; border-radius: 12px;
            font-weight: 600; font-size: 14px; transition: .2s;
        }
        .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(37,99,235,.25); }

        /* APP PAGE */
        .container { width: min(1120px, 92%); margin: auto; padding: 48px 0 80px; }
        .back-link { display: inline-block; margin-bottom: 32px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; }
        .back-link:hover { color: var(--text); }

        .app-hero { display: flex; align-items: center; gap: 44px; margin-bottom: 56px; }
        .app-hero-icon {
            width: 180px; height: 180px; flex: none; object-fit: contain;
            border-radius: 40px; box-shadow: 0 18px 40px rgba(0,0,0,.12);
        }
        .app-hero h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -0.04em; margin-bottom: 12px; }
        .app-hero-description { color: var(--muted); font-size: 18px; line-height: 1.7; margin-bottom: 24px; max-width: 60ch; }

        .product-category {
            display: inline-block; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px; color: var(--blue);
            background: rgba(37,99,235,.08); border-radius: 20px;
            padding: 5px 12px; margin-bottom: 12px;
        }
        .download-button {
            display: inline-block; padding: 12px 24px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white !important; text-decoration: none; border-radius: 12px;
            font-weight: 600; font-size: 14px; transition: .2s;
        }
        .download-button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,.25); }

        .screenshots-section { margin-bottom: 56px; }
        .screenshots-section[hidden] { display: none; }
        .screenshots { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 14px; scroll-snap-type: x proximity; }
        .screenshots img {
            height: 420px; width: auto; flex: none; border-radius: 18px;
            border: 1px solid var(--border); background: white;
            box-shadow: 0 8px 24px rgba(0,0,0,.08); scroll-snap-align: start;
        }

        .app-features { margin-bottom: 48px; }
        .app-features h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 14px; }
        .product-features { list-style: none; }
        .product-features li {
            color: var(--muted); font-size: 16px; padding: 7px 0 7px 26px;
            position: relative; line-height: 1.6; max-width: 70ch;
        }
        .product-features li:before { content: "✓"; position: absolute; left: 0; color: var(--blue); font-weight: 700; }

        .app-offline { color: var(--muted); font-size: 14px; margin-top: 14px; }
        .app-about, .app-how { margin-bottom: 48px; }
        .app-about h2, .app-how h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 14px; }
        .app-about p { color: var(--muted); font-size: 16px; line-height: 1.8; max-width: 70ch; }
        .app-how ol { padding-left: 24px; max-width: 70ch; }
        .app-how li { color: var(--muted); font-size: 16px; line-height: 1.6; padding: 6px 0 6px 6px; }
        .app-links { display: flex; flex-wrap: wrap; gap: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .app-links a { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 14px; }
        .app-links a:hover { text-decoration: underline; }

        .legacy-note {
            font-size: 14px; color: var(--muted); background: rgba(107,114,128,.1);
            border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; line-height: 1.5;
        }
        .legacy-note a { color: var(--blue); font-weight: 600; text-decoration: none; }
        .app-missing { text-align: center; padding: 80px 0; }
        .app-missing h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
        .app-missing a { color: var(--blue); font-weight: 600; text-decoration: none; }

        /* FOOTER */
        footer { border-top: 1px solid var(--border); background: white; }
        .footer-inner {
            width: min(1120px, 92%); margin: auto; height: 90px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { text-decoration: none; color: var(--muted); }
        .footer-links a:hover { color: var(--text); }
        .copyright { color: var(--muted); font-size: 14px; }
        .bmc-link {
            display: inline-flex; align-items: center; gap: 6px; background: #FFDD00;
            color: #000000 !important; padding: 10px 20px; border-radius: 12px;
            font-weight: 600; font-size: 14px; text-decoration: none; transition: .2s;
        }
        .bmc-link:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,221,0,.35); }

        /* MOBILE */
        @media (max-width: 768px) {
            .app-hero { flex-direction: column; align-items: flex-start; gap: 24px; }
            .app-hero-icon { width: 120px; height: 120px; border-radius: 28px; }
            .screenshots img { height: 320px; }
            .footer-inner { flex-direction: column; height: auto; padding: 24px 0; gap: 14px; }
            .footer-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<footer>
    <div class="footer-inner">
        <div class="copyright">© 2026 NovaNext</div>
        <div class="footer-links">
            <a href="product.html">Products</a>
            <a href="about.html">About</a>
            <a href="support.html">Support</a>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>

        </div>
    </div>
</footer>

    renderAppPage('app-page');

</html>
